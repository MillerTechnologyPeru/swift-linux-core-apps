name: Swift

on:
  push:
    branches: [master]
  pull_request:

jobs:

  # Apple's platforms: the guest flavor and its tests, Cacao's, and the apps
  # on Apple's own SwiftUI for macOS and the iOS Simulator.
  macos:
    name: macOS and iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The runners' stable Xcode has an older Swift: Xcode provides the
      # SDKs, and the toolchain comes from swift.org.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4.2"
      - name: Swift version
        run: swift --version
      - name: Install dependencies
        # What Cacao draws and opens windows with.
        run: brew install sdl3 cairo fontconfig
      - name: Build (guest flavor)
        run: swift build
      - name: Test
        run: swift test
      - name: Build (Cacao)
        run: swift build --traits Native
      - name: Build (SwiftUI, macOS)
        run: swift build --traits Apple
      - name: Build (SwiftUI, iOS Simulator)
        run: |
          Scripts/ios-simulator-app.sh calculator Calculator
          Scripts/ios-simulator-app.sh files Files
          Scripts/ios-simulator-app.sh images Images
          Scripts/ios-simulator-app.sh music Music
          Scripts/ios-simulator-app.sh text-editor "Text Editor"
          Scripts/ios-simulator-app.sh clocks Clocks
          Scripts/ios-simulator-app.sh weather Weather
          Scripts/ios-simulator-app.sh contacts Contacts
          Scripts/ios-simulator-app.sh calendar Calendar
          Scripts/ios-simulator-app.sh maps Maps
          Scripts/ios-simulator-app.sh videos Videos
          Scripts/ios-simulator-app.sh browser Browser
          Scripts/ios-simulator-app.sh software Software
          Scripts/ios-simulator-app.sh camera Camera
          Scripts/ios-simulator-app.sh settings Settings

  # Linux on x86_64, with glibc: every flavor Linux has, and both programs
  # run far enough to draw a frame.
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    env:
      SDL_VERSION: release-3.4.8
    steps:
      - uses: actions/checkout@v4
      # dbus-daemon gives the settings' tests a bus of their own.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config git libcairo2-dev libfontconfig-dev \
            libfreetype-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev \
            libgbm-dev libegl-dev libgl-dev libgles-dev libvulkan-dev \
            libdbus-1-dev libudev-dev libpulse-dev libasound2-dev \
            fonts-dejavu-core dbus-daemon
      # Ubuntu 24.04 has no SDL3 package.
      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-noble
      - name: Build SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_VERSION" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/sdl3 -DSDL_TESTS=OFF
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build
      - name: Configure SDL3 paths
        run: |
          echo "PKG_CONFIG_PATH=/opt/sdl3/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/sdl3/lib" >> "$GITHUB_ENV"
      - name: Build (guest flavor)
        run: swift build
      - name: Test
        run: swift test
      - name: Build (Cacao)
        run: swift build --traits Native
      - name: Run the programs
        # Each draws one frame offscreen, saves it and quits.
        timeout-minutes: 2
        env:
          SDL_VIDEO_DRIVER: offscreen
          CACAO_SCREENSHOT_DELAY: "1"
        run: |
          CACAO_SCREENSHOT=calculator.png .build/debug/calculator
          CACAO_SCREENSHOT=files.png .build/debug/files "$PWD"
          # The frame the files program drew is an image to look at.
          CACAO_SCREENSHOT=images.png .build/debug/images files.png
          CACAO_SCREENSHOT=music.png .build/debug/music "$PWD"
          CACAO_SCREENSHOT=editor.png .build/debug/text-editor README.md
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" CACAO_SCREENSHOT=clocks.png .build/debug/clocks
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" XDG_CACHE_HOME="$RUNNER_TEMP/cache" CACAO_SCREENSHOT=weather.png .build/debug/weather
          XDG_DATA_HOME="$RUNNER_TEMP/data" CACAO_SCREENSHOT=contacts.png .build/debug/contacts
          XDG_DATA_HOME="$RUNNER_TEMP/data" CACAO_SCREENSHOT=calendar.png .build/debug/calendar
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" XDG_CACHE_HOME="$RUNNER_TEMP/cache" CACAO_SCREENSHOT=maps.png .build/debug/maps
          CACAO_SCREENSHOT=videos.png .build/debug/videos
          # A new tab's start page: the container has no WPE WebKit.
          XDG_DATA_HOME="$RUNNER_TEMP/data" CACAO_SCREENSHOT=browser.png .build/debug/browser
          # Explore without Flatpak, which the container doesn't have.
          CACAO_SCREENSHOT=software.png .build/debug/software
          # Cacao has no camera yet, which the camera says.
          CACAO_SCREENSHOT=camera.png .build/debug/camera
          # No session bus in the container, which Settings says.
          CACAO_SCREENSHOT=settings.png .build/debug/settings

  # Linux on arm64, linked statically against musl with Swift's static SDK:
  # the guest flavor and the apps' logic. Cacao's flavor isn't built this
  # way, since the SDK has no SDL, Cairo or FontConfig to link.
  linux-musl:
    name: Linux (arm64, musl)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    env:
      STATIC_SDK: https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
      STATIC_SDK_CHECKSUM: 3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Install the static Linux SDK
        run: |
          swift sdk install "$STATIC_SDK" --checksum "$STATIC_SDK_CHECKSUM"
          swift sdk list
      - name: Build (guest flavor)
        run: swift build --swift-sdk aarch64-swift-linux-musl
